[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "chn4-bridge"
dynamic = ["version"]
description = "Read-only SWD bridge that streams the four channels of the 18650-4CHN Li-ion charger/tester (library, CLI, WebSocket)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Puparia (Pupariaa)" }]
requires-python = ">=3.11"
keywords = ["18650", "battery", "charger", "swd", "pyocd", "cmsis-dap", "wch-link", "reverse-engineering", "websocket", "cortex-m0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pyocd>=0.36",
    "websockets>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
chn4-bridge = "chn4_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/Pupariaa/18650-4CHN-SWD-Monitor"
Documentation = "https://github.com/Pupariaa/18650-4CHN-SWD-Monitor#readme"
Issues = "https://github.com/Pupariaa/18650-4CHN-SWD-Monitor/issues"
Author = "https://techalchemy.fr"

[tool.hatch.version]
path = "src/chn4_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chn4_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "images", "README.md", "LICENSE", "CHANGELOG.md", "config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["chn4_bridge"]
known-local-folder = ["helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chn4_bridge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyocd", "pyocd.*"]
ignore_missing_imports = true
