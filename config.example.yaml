probe:
  unique_id: null
  frequency_hz: 100000

acquisition:
  interval_s: 1.0
  consistency_reads: 2
  consistency_retries: 2
  read_timeout_s: 5.0
  reconnect_attempts: 5
  reconnect_delay_s: 3.0
  stale_after_s: 5.0

estimation:
  window_s: 5.0
  idle_after_s: 4.0
  reset_tolerance_mah: 0.05

adc:
  full_scale_v: 4.4
  full_scale_counts: 4095
  min_valid_v: 2.0
  max_valid_v: 4.4

resistance:
  offsets_mohm:
    ch1: 34.0
    ch2: 34.0
    ch3: 40.0
    ch4: 40.0

server:
  host: 127.0.0.1
  port: 8765
  allow_remote: false
  broadcast_interval_s: 1.0
  client_queue_size: 8
  send_timeout_s: 5.0
  heartbeat_interval_s: 20.0
  heartbeat_timeout_s: 20.0
  max_clients: 16
  allowed_origins: null
  include_experimental: false
